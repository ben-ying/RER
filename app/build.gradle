apply plugin: 'com.android.application'

android {
    namespace "com.yjh.rer"
    compileSdkVersion 34
    buildToolsVersion "28.0.3"
    defaultConfig {
        applicationId "com.yjh.rer"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            // Exclude sed* temporary files accidentally generated in source tree.
            java {
                exclude "**/sed*"
            }
        }
    }
}

dependencies {
    configurations.all {
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
    }

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // AndroidX libraries
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.core:core:1.10.1'
    implementation 'androidx.fragment:fragment:1.6.2'
    testImplementation "junit:junit:4.12"

    // Align Kotlin stdlib to avoid duplicate classes.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.20"

    // Architecture Components - AndroidX
    def lifecycle_version = "2.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:$lifecycle_version"
    
    // Room - AndroidX
    def room_version = "2.5.2"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    // retrofit2
    implementation "com.squareup.retrofit2:retrofit:2.6.0"
    implementation "com.squareup.retrofit2:converter-gson:2.6.0"
    implementation "com.squareup.retrofit2:adapter-rxjava2:2.6.0"
    implementation "io.reactivex.rxjava2:rxandroid:2.1.0"
    // dagger2
    def dagger_version = "2.28.3"
    implementation "com.google.dagger:dagger:$dagger_version"
    implementation "com.google.dagger:dagger-android:$dagger_version"
    implementation "com.google.dagger:dagger-android-support:$dagger_version"
    annotationProcessor "com.google.dagger:dagger-compiler:$dagger_version"
    annotationProcessor "com.google.dagger:dagger-android-processor:$dagger_version"
    // rxBinding
    implementation "com.jakewharton.rxbinding2:rxbinding:2.0.0"
    // rxBinding support-v4
    implementation "com.jakewharton.rxbinding2:rxbinding-support-v4:2.0.0"
    // MPAndroidChart
    implementation "com.github.PhilJay:MPAndroidChart:v3.0.2"
    // leakCanary
    // debugCompile 'com.squareup.leakcanary:leakcanary-android:1.5.1'
    // releaseCompile 'com.squareup.leakcanary:leakcanary-android-no-op:1.5.1'
    // Timber
    implementation "com.jakewharton.timber:timber:4.6.1"
    // Glide
    implementation "com.github.bumptech.glide:glide:4.8.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.8.0"
    // RxPermission
    implementation 'com.github.tbruyelle:rxpermissions:0.10.2'

    implementation 'org.apache.commons:commons-lang3:3.4'
}
